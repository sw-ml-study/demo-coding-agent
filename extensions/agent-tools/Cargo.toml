[package]
name = "mlpl-extension-agent-tools"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Narrow OS mechanisms for the mlplcode coding agent: ripgrep search and allow-listed process runs."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned to the demo-extensions revision recorded in docs/cross-repo-handoffs.md.
mlpl-extension-sdk = { git = "https://github.com/sw-ml-study/demo-extensions", rev = "2b2ae48e483284ddc83956f464a7481d170367b8" }
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"

[dev-dependencies]
mlpl-extension-loader = { git = "https://github.com/sw-ml-study/demo-extensions", rev = "2b2ae48e483284ddc83956f464a7481d170367b8" }
tempfile = "3"

[lints]
workspace = true
